<!--v-->

## 认知的孤岛

- 自然语言：模糊、不精确、多义
  - 索绪尔：语言符号是任意的
  - 语言更接近统计学的涌现
- 从思考到交流的困境
  - Language is primarily a tool for communication rather than thought: fMRI 说明人在思考的时候大脑的语言区域并不活跃
  - Thurston: 数学是一种高度压缩的结构
- 盒中甲虫：你无法知道别人心中的“语言”是什么样子

<br/>

<div class="fragment" style="text-align: center;">

**该怎么相信语言真的能向别人表达我的想法？**

</div>

<!--v-->

## 形式语言

- 减弱的表达能力
  - $(A \to B) \to (B \to C) \to (A \to C)$
  - 和下雨，我知道下雨了，别人打伞有什么关系？
  - 剥离了我们认为无关的东西，更加精确
  - 不是更适合思考的结构： Russell 用了四百页才表达清楚 $1 + 1 = 2$
  - 而是在表达中更可信的结构

<!--v-->

## 构造形式语言的过程

- 形式语言设计的社会过程
  - Atiyah：理论是为了下一代快速理解一个领域而构造的
  - 编程语言：从机器码到汇编语言到高级语言
    - 汇编：`add eax, 1`
    - 高级语言：`x = x + 1` 
  - 数学史上，仍是口头、图像活动的希腊数学停滞了

- 也许被你忽视了的第三方
  - 形式语言引入了一个客观的、无情的第三方仲裁者（Compiler、Proof Checker、逻辑公理）
  - 社会构造的过程：逐渐修正形式语言中被认为“不能表达想法”的部分

## Ariane 5 火箭事故

- **形式语言**：编程语言
- **问题**：形式化的编程语言没能完全表达飞行控制算法
- **后果**：火箭发射后37秒自毁，损失5亿美元

<!--v-->

## “符号沙文主义”的幻觉

De Millo, Lipton, Perlis 在 *Social Processes* 中提出的尖锐批评：

- **验证不是信息**
  - 一个长得没人能读懂的形式化证明，没有任何社会价值。
  - "没人会拿着一堆符号跑到大厅里找人听他讲。"
- **形式化的局限**
  - 现实世界的软件规范是"锯齿状、充满漏洞"的。
  - 试图用完美的符号去包裹不完美的现实，这本身就是一种**错觉**。

<!--v-->

## 形式语言的缺陷

- 可能无法完美反馈人类的意图
- 无法证明自己是正确的（哥德尔不完备定理）

<br/>

<div class="fragment">

**结论：形式语言本身并不提供真理，它只提供待验证的“靶子”。**

</div>

<br/>

<div class="fragment">

社会过程：

- 孤立的语言中有悖论不足为惧
- 错误基础上搭建的物理学会导致桥梁倒塌

</div>

<!--v-->

## 信任来源于社会过程

- 形式语言的优势不在于不出错
  - 波普尔：能被证伪的理论才是好的理论
  - 形式语言在公共言语中树立了一个客观的“标靶”

- 数学实际上是“一个社会的、直觉的、有机的、人类的过程，是一个社区项目”,数学家不会在得出证明后独自陶醉，而是会迫切地寻找听众，从在黑板上画草图到正式发表，这一过程不仅是传播，更是一个过滤和精炼的过程。

- 基础软件的测试
  - 如果你在 Python 里面写 `1 + 1` 结果不是 `2`
  - 开源社区修复漏洞

- 更长更精确的证明不能保证自己完全正确，但是能快速暴露潜在的问题
  - Ariane 5 火箭事故后，人们将程序分析方法应用于飞行控制软件的开发中

<!--v-->

## 黑箱信任

我们每天都在把生命托付给形式语言（操作系统、刹车控制系统、银行结算）

- 生活中的形式语言
  - Linux 内核：约 3000 万行代码
  - Windows 10：约 5000 万行代码
  - **代价**：形式语言是昂贵的。没人有时间、精力或能力去逐行验证这些代码的真伪。

- **实用主义的跳跃**
  - 我们没有验证它，但我们相信它
  - 开源社区的修补，还是商业公司的QA，本质上都是一种“社会担保”
  - 我们不是相信代码本身是无误的，我们是相信“这么多人用了都没事”（概率与社会经验）
  - 我们接受了将形式语言视为一个**可用的黑箱**，只要它在社会运转中保持 Robust

## 为什么我们渴望形式化？

如果形式语言既繁琐又不能保证绝对正确，由于什么我们如此迷恋它？

- **客观性的面具**
  - 将主观判断转化为 $\forall x \exists y$，仿佛它就变成了不容置疑的真理
  - 这是一种**修辞策略**：利用对数学/机器的信任，来为人类的论点背书

- **Sanity Check**
  - 我们无暇顾及所有细节，形式语言提供了一种**心理安全感**
  - 思维的安全绳（虽然可能没有连在任何实物上）

<!--v-->

## 规训与自由

从福柯与德里达的视角：

- **逻各斯中心主义**
  - 我们总是渴望一个确定的、中心的意义
  - 形式语言满足了这种渴望，它强行绑定了能指与所指

- **规训**
  - 接受一套形式语言（如编程语法、数学公理），就是接受一套**社会规训**
  - 我们牺牲了表达的自由与模糊的诗意，换取了在社会网络中被“信任”的资格

<!--v-->

## 总结：信任的契约

回到最初的问题：我们获得了什么？

1. 不是思维工具，而是信任的工具
2. 不是绝对的真理，而是可被证伪的社会共识
3. **形式语言是一种信念**

相信通过遵循这套规则，我们能跨越认知的孤岛，即使我们永远无法确知对方所说盒子里的甲虫是什么，但至少我们可以一起建造一座不会轻易倒塌的大桥。
